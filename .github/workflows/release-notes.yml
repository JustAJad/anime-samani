name: Sync 1.1 release notes
on:
  push:
    branches: [main]
    paths: [RELEASE-NOTES.md, RELEASE-NOTES.ja.md, scripts/sync-release-notes.cjs, .github/workflows/release-notes.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samani-release-notes-1.1
  cancel-in-progress: false
jobs:
  notes:
    if: github.repository == 'JustAJad/anime-samani' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync public release text and its text attachment
        run: node scripts/sync-release-notes.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
