name: Windows · Tests et versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after a successful build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests et construction Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Stamp update version
        if: github.event_name != 'pull_request'
        run: node scripts/version.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run regression tests
        run: npm test
      - name: Exercise the actual Electron window
        run: npm run test:electron
      - name: Build Windows packages
        run: npm run build:win:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
      - name: Verify installed Windows name and publisher
        shell: pwsh
        run: ./scripts/check-installer.ps1
      - name: Collect downloads and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/*.exe,dist/*.zip,dist/*.yml,dist/*.blockmap release-assets/
          Copy-Item NOTICE.md,LICENSE,CREDITS.md,RELEASE-NOTES.md release-assets/
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/source.cjs
          node scripts/size-report.cjs
          python -c "import subprocess,zipfile; from pathlib import Path; z=zipfile.ZipFile('release-assets/Anime-Samani-$appVersion-Source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,'anime-samani-$appVersion/'+p) for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if Path(p).is_file()]; z.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Anime-Samani-Windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publication de la version
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Anime-Samani-Windows
          path: release-assets
      - name: Publish a new version without replacing existing releases
        run: node scripts/release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMANI_REBUILD_VERSION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-1.1]') && '1.1.0' || '' }}
